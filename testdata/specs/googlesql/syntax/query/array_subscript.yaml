spec: docs/specs/googlesql/syntax/query/array_subscript.md
dialect: googlesql
cases:
  - desc: OFFSET is zero-based
    sql: SELECT [10, 20, 30][OFFSET(1)] AS v
    expected:
      rows:
        - [20]
  - desc: ORDINAL is one-based
    sql: SELECT [10, 20, 30][ORDINAL(1)] AS v
    expected:
      rows:
        - [10]
  - desc: SAFE_OFFSET returns NULL out of range
    sql: SELECT [10, 20, 30][SAFE_OFFSET(5)] AS v
    expected:
      rows:
        - [null]
  - desc: SAFE_ORDINAL returns NULL out of range
    sql: SELECT [10, 20, 30][SAFE_ORDINAL(5)] AS v
    expected:
      rows:
        - [null]
  # A bare arr[n] is arr[OFFSET(n)], as in BigQuery.
  - desc: bare subscript on an array literal
    sql: SELECT [10, 20][0] AS a, [10, 20][1] AS b
    expected:
      rows:
        - [10, 20]
  - desc: bare subscript on a function result
    sql: SELECT SPLIT('a,b', ',')[1] AS v
    expected:
      rows:
        - ["b"]
  - desc: bare subscript on an array column
    sql: SELECT x[0] AS v FROM UNNEST([STRUCT([7, 8] AS x)])
    expected:
      rows:
        - [7]
  - desc: field access after a bare subscript
    sql: SELECT [STRUCT(1 AS f)][0].f AS v
    expected:
      rows:
        - [1]
  - desc: bare subscript on a NULL array is NULL
    sql: SELECT CAST(NULL AS ARRAY<INT64>)[0] AS v
    expected:
      rows:
        - [null]
  - desc: bare subscript out of range is an error
    sql: SELECT [10, 20][5] AS v
    expected:
      error:
        contains: "out of range"
  - desc: bare subscript with a negative index is an error
    sql: SELECT [10, 20][-1] AS v
    expected:
      error:
        contains: "out of range"
